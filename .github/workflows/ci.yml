name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (web client)
        if: runner.os == 'Linux'
        run: node --test clients/web/test/*.test.mjs
      # Capture and input on a real desktop: a window streams, and typing into it changes it.
      - name: Selftest (Windows, Notepad)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p rr-server
          Start-Process notepad
          Start-Sleep -Seconds 3
          ./target/release/rein-remote.exe windows
          ./target/release/rein-remote.exe selftest --window Notepad --type "rein remote was here"
      - name: Selftest (Linux, an xterm on Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm > /dev/null
          cargo build --release -p rr-server
          Xvfb :20 -screen 0 1280x720x24 & sleep 2
          DISPLAY=:20 xterm -T selftest -e bash --norc & sleep 2
          DISPLAY=:20 ./target/release/rein-remote windows
          DISPLAY=:20 ./target/release/rein-remote selftest --window selftest --type "echo rein remote was here"
          DISPLAY=:20 ./target/release/rein-remote selftest --display :20
      # Sound: a client that plays it gets Opus packets of what the machine plays, one that says it
      # doesn't gets none, and with no sound to be had the video streams on its own.
      - name: Sound (Linux, PulseAudio with a null sink as the output and a tone played into it)
        if: runner.os == 'Linux'
        run: |
          node -e "process.exit(typeof WebSocket === 'function' ? 0 : 1)" || export NODE_OPTIONS=--experimental-websocket
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils > /dev/null
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rr && pactl set-default-sink rr
          Xvfb :21 -screen 0 1280x720x24 & sleep 2
          ./target/release/rein-remote serve --display :21 --listen 127.0.0.1:7979 --webtransport off 2> serve.log & sleep 2
          pactl load-module module-sine sink=rr frequency=440
          node tools/listen.mjs http://127.0.0.1:7979/ --seconds 4 | tee sound.json
          node tools/listen.mjs http://127.0.0.1:7979/ --seconds 2 --audio off | tee none.json
          grep -v '^rein-remote: {' serve.log
          node -e "const r = require('./sound.json'); if (!(r.videoFrames > 0 && r.audioPackets > 100 && r.serverAudio.loud_packets > 100)) process.exit(1)"
          node -e "const r = require('./none.json'); if (!(r.videoFrames > 0 && r.audioPackets === 0)) process.exit(1)"
      - name: Sound (Windows, WASAPI loopback; a runner may have no output device, and the video streams anyway)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "process.exit(typeof WebSocket === 'function' ? 0 : 1)"
          if ($LASTEXITCODE -ne 0) { $env:NODE_OPTIONS = '--experimental-websocket' }
          Start-Process notepad
          Start-Sleep -Seconds 2
          $p = Start-Process ./target/release/rein-remote.exe -ArgumentList 'serve','--window','Notepad','--listen','127.0.0.1:7979','--webtransport','off' -RedirectStandardError serve.log -PassThru
          Start-Sleep -Seconds 3
          node tools/listen.mjs http://127.0.0.1:7979/ --seconds 4 | Tee-Object -FilePath sound.json
          Stop-Process $p
          Get-Content serve.log | Select-String -NotMatch '^rein-remote: \{'
          $r = Get-Content sound.json -Raw | ConvertFrom-Json
          if ($r.videoFrames -lt 1) { throw 'no video' }
          if ($r.audioPackets -eq 0 -and -not (Select-String -Path serve.log -Pattern 'no sound \(' -Quiet)) { throw 'no sound, and no reason why' }
      - name: Selftest (macOS, test pattern; screen capture needs a permission runners can't give)
        if: runner.os == 'macOS'
        run: cargo run --release -p rr-server -- selftest --test-pattern
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: The protocol for the web client
        run: cargo build -p rr-proto --target wasm32-unknown-unknown --release
