name: Release
# A tag like v0.1.0 builds rein-remote for every platform and publishes a GitHub release with the
# archives and SHA256SUMS (what Rein checks before installing one). Unsigned for now (ROADMAP phase 6).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release (a draft until every build is in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "rein-remote $GITHUB_REF_NAME" --notes "Builds for macOS, Linux and Windows. Check them against SHA256SUMS."
  build:
    needs: create
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --release -p rr-server --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="rein-remote-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/rein-remote.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/rein-remote" "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          sha256sum * > ../SHA256SUMS
          cd .. && cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
  # npm: the web client, the server's front package and one package per platform binary, from the
  # archives just published. Only when the repository has an NPM_TOKEN secret.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and publish the npm packages
        if: env.NPM_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
          bins=()
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            n="rein-remote-$GITHUB_REF_NAME-$t"
            if [ -f "$n.zip" ]; then unzip -q "$n.zip"; bins+=(--bin "$t=$PWD/$n/rein-remote.exe"); else tar xzf "$n.tar.gz"; bins+=(--bin "$t=$PWD/$n/rein-remote"); fi
          done
          cd ..
          node npm/build.mjs --out npm-out --version "${GITHUB_REF_NAME#v}" "${bins[@]}"
          # The platform packages first: the front package depends on them.
          for d in npm-out/remote-server-* npm-out/remote-server npm-out/remote; do npm publish "$d" --access public --provenance; done
