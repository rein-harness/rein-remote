[workspace]
resolver = "2"
members = ["crates/rr-proto", "crates/rr-client", "crates/rr-ffi", "crates/rr-jni", "crates/rr-server", "crates/rr-viewer", "crates/rr-host-gtk"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/rein-harness/rein-remote"
rust-version = "1.82"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
