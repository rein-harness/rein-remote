[package]
name = "rr-server"
description = "The Rein Remote server: capture, encode, transport, input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rein-remote"
path = "src/main.rs"

[dependencies]
openh264-sys2 = "0.6.6"
rr-proto = {path = "../rr-proto"}
aes-gcm = "0.10.3"
des = "0.9.0"
getrandom = "0.3"
if-addrs = "0.15.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
hkdf = "0.12.4"
sha2 = "0.10.9"
socket2 = "0.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
wtransport = "0.7.2"
zune-jpeg = "0.4"
tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
mdns-sd = { version = "0.21", default-features = false }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["composite", "damage", "shm", "xfixes", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.1"
