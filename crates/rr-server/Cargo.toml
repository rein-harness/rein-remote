[package]
name = "rr-server"
description = "The Rein Remote server: capture, encode, transport, input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rein-remote"
path = "src/main.rs"

[dependencies]
openh264 = "0.6.5"
rr-proto = {path = "../rr-proto"}
tungstenite = "0.29.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["shm", "xtest"] }
