[package]
name = "rr-client"
description = "Rein Remote's native client core: connect (QUIC/WebTransport, WebSocket, or a relay, then straight through NAT), pair and sign in, find servers on the network; no UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rr-proto = {path = "../rr-proto"}
aes-gcm = "0.10.3"
getrandom = "0.3"
hkdf = "0.12.4"
if-addrs = "0.15.0"
mdns-sd = { version = "0.21", default-features = false }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
wtransport = "0.7.2"

# iOS gives an app no file of the system's roots (rustls-native-certs finds none there), and Android
# keeps them where it doesn't look (/system/etc/security/cacerts, an APEX since Android 14): Mozilla's.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
webpki-roots = "1"
