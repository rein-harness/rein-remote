# The iOS and iPadOS app. Generate the Xcode project with `xcodegen` (it isn't checked in), after
# building the Rust core: ./build-core.sh (see README.md).
name: ReinRemote
options:
  bundleIdPrefix: dev.reinharness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set yours (Xcode > Settings > Accounts; a free Apple ID works) or pass DEVELOPMENT_TEAM=… to
    # xcodebuild; the simulator needs none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ReinRemote:
    type: application
    platform: iOS
    sources: [ReinRemote]
    dependencies:
      - framework: build/ReinRemoteCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: VideoToolbox.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reinharness.remote
        PRODUCT_NAME: Rein Remote
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ReinRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
    info:
      path: ReinRemote/Info.plist
      properties:
        CFBundleDisplayName: Rein Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # A trackpad's or mouse's clicks as clicks (touches of type indirectPointer, with their buttons).
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Rein Remote finds the computers you can reach on this network, and connects to them.
        NSBonjourServices: [_rein-remote._tcp]
        NSCameraUsageDescription: To scan the pairing code a computer shows.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
  ReinRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReinRemoteTests]
    dependencies:
      - target: ReinRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reinharness.remote.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Rein Remote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rein Remote
        BUNDLE_LOADER: $(TEST_HOST)
  ReinRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReinRemoteUITests]
    dependencies:
      - target: ReinRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reinharness.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReinRemote
schemes:
  ReinRemote:
    build:
      targets:
        ReinRemote: all
        ReinRemoteTests: [test]
        ReinRemoteUITests: [test]
    test:
      targets: [ReinRemoteTests, ReinRemoteUITests]
      gatherCoverageData: false
