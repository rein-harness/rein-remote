<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rein Remote</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0e; color: #e8ecf2; font: 13px ui-monospace, Menlo, monospace; }
    main { display: flex; flex-direction: column; height: 100%; }
    #bar { padding: 6px 10px; border-bottom: 1px solid #2a2b31; display: flex; gap: 14px; white-space: nowrap; overflow: hidden; }
    #bar b { color: #4cc9ff; flex-shrink: 0; }
    #stats { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #screen { flex: 1; display: grid; place-items: center; min-height: 0; }
    canvas { max-width: 100%; max-height: 100%; outline: none; background: #000; touch-action: none; }
    #kb { margin-left: auto; background: none; color: inherit; border: 1px solid #2a2b31; border-radius: 6px; font: inherit; padding: 2px 10px; display: none; flex-shrink: 0; }
    @media (pointer: coarse) { #kb { display: block; } }
  </style>
</head>
<body>
  <main>
    <div id="bar"><b>Rein Remote</b><span id="stats">connecting…</span><button id="kb" aria-label="Keyboard">⌨ keyboard</button></div>
    <div id="screen"><canvas id="c"></canvas></div>
  </main>
  <script type="module">
    import {connect} from './rein-remote.js';
    const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/stream`;
    const s = connect(url, document.getElementById('c'));
    window.reinRemote = s;
    document.getElementById('kb').onclick = () => s.keyboard();
    setInterval(() => {
      const t = s.stats;
      document.getElementById('stats').textContent = `${t.state} · ${t.decoder || '…'} · ${t.frames} frames · ${(t.bytes / 1e6).toFixed(1)} MB · rtt ${t.rttMs.toFixed(0)} ms${t.error ? ' · ' + t.error : ''}`;
    }, 500);
  </script>
</body>
</html>
