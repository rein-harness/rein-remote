# One name for the fleet: each relay's /healthz checked twice a second, two misses take it out; a
# connection that fails goes to the next relay (redispatch). WebSockets pass through (tunnel timeout).
global
  log stdout format raw local0 info
defaults
  mode http
  log global
  option httplog
  timeout connect 1s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h
  retries 2
  option redispatch 1
frontend relay
  bind :7990
  default_backend relays
backend relays
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 500ms fall 2 rise 2
  server a relay-a:7990 check
  server b relay-b:7990 check
